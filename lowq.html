<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LowQ • White Light</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@200;400;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box;font-family:'Outfit',sans-serif}
body{
  min-height:100vh;
  background:#050505;
  display:flex;align-items:center;justify-content:center;
  padding:20px;color:#fff;
  position:relative;overflow:hidden;
}
body::before{
  content:"";
  position:absolute;width:600px;height:600px;
  background: radial-gradient(circle, rgba(255,255,255,0.18) 0%, transparent 70%);
  top:-150px;left:50%;transform:translateX(-50%);
  filter: blur(20px);
}
.glass{
  width:100%;max-width:400px;
  background: rgba(255,255,255,0.06);
  backdrop-filter: blur(30px) saturate(150%);
  -webkit-backdrop-filter: blur(30px) saturate(150%);
  border:1px solid rgba(255,255,255,0.14);
  border-radius:28px;
  padding:24px;
  position:relative;z-index:1;
  box-shadow: 0 0 0 1px rgba(255,255,255,0.05) inset, 0 20px 80px rgba(0,0,0,0.8), 0 0 60px rgba(255,255,255,0.05);
}
.header{text-align:center;margin-bottom:22px}
.header .light{
  width:60px;height:60px;margin:0 auto 12px;
  background:#fff;
  border-radius:50%;
  box-shadow: 0 0 20px rgba(255,255,255,0.9), 0 0 50px rgba(255,255,255,0.4), 0 0 80px rgba(255,255,255,0.15);
  display:grid;place-items:center;color:#000;font-size:24px;
}
.header h1{font-weight:600;letter-spacing:3px;font-size:15px}
.header p{font-weight:200;letter-spacing:1px;font-size:11px;opacity:0.5;margin-top:4px;text-transform:uppercase}

.upload{
  border:1px solid rgba(255,255,255,0.12);
  background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
  border-radius:18px;padding:20px;text-align:center;cursor:pointer;
  transition:0.3s;
}
.upload:hover{border-color:rgba(255,255,255,0.3);box-shadow:0 0 30px rgba(255,255,255,0.08)}
.upload input{display:none}
.upload b{font-weight:600;letter-spacing:0.5px}
.upload small{opacity:0.4;font-weight:200}

.row{display:flex;gap:10px;margin-top:14px}
.box{
  flex:1;
  background: rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:14px;padding:12px;
}
.box label{display:block;font-size:10px;letter-spacing:1.5px;opacity:0.4;margin-bottom:8px;text-transform:uppercase}
select{
  width:100%;background:#111;color:#fff;
  border:1px solid rgba(255,255,255,0.1);
  border-radius:8px;padding:8px;font-size:13px;
}
.range-wrap{margin-top:14px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:12px}
.range-wrap label{font-size:10px;letter-spacing:1.5px;opacity:0.4;text-transform:uppercase}
input[type=range]{width:100%;accent-color:#fff;margin-top:8px}

.btn-main{
  width:100%;margin-top:18px;padding:15px;
  background:#fff;color:#000;
  border:none;border-radius:14px;
  font-weight:600;letter-spacing:1px;font-size:13px;
  box-shadow: 0 0 25px rgba(255,255,255,0.5), 0 0 50px rgba(255,255,255,0.2);
  cursor:pointer;transition:0.2s;
}
.btn-main:active{transform:scale(0.97);box-shadow:0 0 15px rgba(255,255,255,0.3)}

video{width:100%;margin-top:16px;border-radius:14px;background:#000;display:none;border:1px solid rgba(255,255,255,0.1)}
.status{text-align:center;font-size:11px;letter-spacing:1px;margin-top:12px;opacity:0.5;font-weight:200}
.dl{
  display:none;text-align:center;margin-top:12px;padding:12px;
  background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);
  border-radius:12px;color:#fff;text-decoration:none;font-size:13px;
}
</style>
</head>
<body>
<div class="glass">
  <div class="header">
    <div class="light">◐</div>
    <h1>LOWQ STUDIO</h1>
    <p>White Light Edition • 144p / Low FPS</p>
  </div>

  <label class="upload" for="file">
    <b>DROP VIDEO HERE</b><br><small>tap to browse</small>
    <input type="file" id="file" accept="video/*">
  </label>

  <div class="row">
    <div class="box">
      <label>Resolution</label>
      <select id="res">
        <option value="144">144p • Max Blur</option>
        <option value="240" selected>240p • Meme</option>
        <option value="360">360p • Low</option>
      </select>
    </div>
    <div class="box">
      <label>Frame Rate</label>
      <select id="fps">
        <option value="5">5 FPS</option>
        <option value="10" selected>10 FPS</option>
        <option value="15">15 FPS</option>
      </select>
    </div>
  </div>

  <div class="range-wrap">
    <label>Light Intensity: <span id="qv" style="opacity:1;color:#fff">0.3</span></label>
    <input type="range" id="q" min="0.1" max="1" step="0.1" value="0.3">
  </div>

  <button class="btn-main" id="go">CONVERT → LOW QUALITY</button>
  <div class="status" id="st"></div>
  <video id="prev" controls playsinline></video>
  <a id="dl" class="dl">⬇ Download White Light Result</a>
</div>

<script>
const file=document.getElementById('file'),prev=document.getElementById('prev'),res=document.getElementById('res'),fps=document.getElementById('fps'),q=document.getElementById('q'),qv=document.getElementById('qv'),st=document.getElementById('st');
let vidFile;q.oninput=()=>qv.textContent=q.value;
file.onchange=e=>{vidFile=e.target.files[0];if(vidFile){prev.src=URL.createObjectURL(vidFile);prev.style.display='block';st.textContent=vidFile.name}};
document.getElementById('go').onclick=async()=>{
 if(!vidFile)return alert('Upload dulu!');
 st.textContent='processing light...';
 const W=parseInt(res.value),FPS=parseInt(fps.value);
 const v=document.createElement('video');v.src=URL.createObjectURL(vidFile);v.muted=true;await v.play().catch(()=>{});await new Promise(r=>v.onloadedmetadata=r);
 const h=W*(v.videoHeight/v.videoWidth);const c=document.createElement('canvas');c.width=W;c.height=h;const ctx=c.getContext('2d');
 const stream=c.captureStream(FPS);const rec=new MediaRecorder(stream,{mimeType:'video/webm;codecs=vp8',videoBitsPerSecond:W*800});const chunks=[];rec.ondataavailable=e=>chunks.push(e.data);
 rec.onstop=()=>{const b=new Blob(chunks,{type:'video/webm'});const u=URL.createObjectURL(b);prev.src=u;prev.style.display='block';const d=document.getElementById('dl');d.href=u;d.download=`lowq-white-${W}p.webm`;d.style.display='block';st.textContent=`DONE • ${W}p ${FPS}fps`};
 rec.start();let last=0;
 function draw(now){if(v.ended||v.paused){rec.stop();return}if(now-last>=1000/FPS){ctx.imageSmoothingEnabled=false;ctx.drawImage(v,0,0,W,h);last=now}requestAnimationFrame(draw)}
 v.play();requestAnimationFrame(draw);
};
</script>
</body>
  </html>
